<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620" role="img" aria-labelledby="title desc">
  <title id="title">NAZUNA BOT - versão modificada GYOMEI</title>
  <desc id="desc">Arte escura que representa uma base antiga recuperada, reforçada e modernizada, com referências vampíricas, pedra, contas de oração e energia púrpura.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07040f"/>
      <stop offset="0.45" stop-color="#17102d"/>
      <stop offset="1" stop-color="#08080c"/>
    </linearGradient>
    <radialGradient id="moon" cx="50%" cy="40%" r="65%">
      <stop offset="0" stop-color="#f0d9ff"/>
      <stop offset="0.42" stop-color="#a764ff"/>
      <stop offset="1" stop-color="#5b168e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="redGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff245f" stop-opacity="0"/>
      <stop offset="0.6" stop-color="#ff245f" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#ff8bad" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ded7c8"/>
      <stop offset="0.45" stop-color="#6f6874"/>
      <stop offset="1" stop-color="#22202b"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff1a6"/>
      <stop offset="0.45" stop-color="#d6a839"/>
      <stop offset="1" stop-color="#7c4d0d"/>
    </linearGradient>
    <pattern id="scan" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="1" fill="#ffffff" opacity="0.025"/>
    </pattern>
    <filter id="blur20"><feGaussianBlur stdDeviation="20"/></filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity="0.8"/></filter>
    <clipPath id="round"><rect x="18" y="18" width="1564" height="584" rx="42"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1600" height="620" fill="url(#bg)"/>
    <rect width="1600" height="620" fill="url(#scan)"/>

    <circle cx="310" cy="245" r="255" fill="url(#moon)" opacity="0.8" filter="url(#blur20)"/>
    <circle cx="310" cy="245" r="152" fill="#d8b8ff" opacity="0.12"/>
    <path d="M390 105c-90 34-139 135-105 225 23 62 80 105 145 113-119 43-250-19-294-140-44-120 18-253 138-297 39-14 80-18 116-10z" fill="#ecdfff" opacity="0.72" filter="url(#glow)"/>

    <path d="M0 468 C180 397 302 448 478 388 C602 346 694 326 812 364 C980 419 1092 341 1241 371 C1395 402 1512 486 1600 439 L1600 620 L0 620Z" fill="#050509" opacity="0.95"/>
    <path d="M0 483 C203 423 329 482 493 412" fill="none" stroke="url(#redGlow)" stroke-width="10"/>

    <!-- Silhueta vampírica reconstruída -->
    <g transform="translate(110 92)" filter="url(#shadow)">
      <path d="M185 76c52-40 132-21 158 40 14 32 11 69-4 98-12 24-13 55-2 81l39 91-65-42-29 102-49-82-58 81-18-103-77 33 55-90c16-27 19-59 6-88-19-43-5-95 44-121z" fill="#15101d" stroke="#ff4f82" stroke-opacity="0.62" stroke-width="3"/>
      <path d="M169 111c14-43 64-64 106-44 39 18 57 65 42 104-8 22-25 37-43 50l-9 42-47 9-40-29 3-35c-28-18-39-61-12-97z" fill="#252033"/>
      <path d="M160 123c8-64 80-99 132-61 23 17 34 41 35 68-30-25-59-36-93-32-28 3-47 13-74 25z" fill="#d9d3e2" opacity="0.8"/>
      <path d="M191 174l31 9-29 7zM259 183l29-10-25 20z" fill="#ff386f" filter="url(#glow)"/>
      <path d="M218 232l9 20 9-20" fill="none" stroke="#ffb8cc" stroke-width="4"/>
      <path d="M109 340l77-35M338 340l-59-42" stroke="#a63cff" stroke-width="6" opacity="0.42"/>
      <path d="M123 329l28 13-18 26M318 324l-25 18 22 23" fill="none" stroke="url(#gold)" stroke-width="5"/>
    </g>

    <!-- Guardião de pedra e contas -->
    <g transform="translate(1180 54)" filter="url(#shadow)">
      <path d="M128 72c50-16 109 9 127 58 12 31 5 65-11 91 44 46 65 114 58 181l-19 154H32L14 405c-8-68 11-133 55-180-24-33-25-78 1-112 14-19 34-33 58-41z" fill="url(#stone)" stroke="#aa9ec1" stroke-width="3"/>
      <path d="M86 153c20-23 85-29 118 2l-12 77-44 23-47-23z" fill="#24212b"/>
      <path d="M105 172l31 13-32 6zM164 185l31-13-26 21z" fill="#f0d28c" filter="url(#glow)"/>
      <path d="M114 260c-45 40-57 105-29 156M190 259c47 40 60 105 32 157" fill="none" stroke="#16121d" stroke-width="20" stroke-linecap="round"/>
      <g fill="url(#gold)" stroke="#50300d" stroke-width="2">
        <circle cx="92" cy="282" r="17"/><circle cx="76" cy="315" r="17"/><circle cx="69" cy="350" r="17"/><circle cx="72" cy="385" r="17"/><circle cx="86" cy="418" r="17"/>
        <circle cx="210" cy="282" r="17"/><circle cx="227" cy="315" r="17"/><circle cx="234" cy="350" r="17"/><circle cx="230" cy="385" r="17"/><circle cx="216" cy="418" r="17"/>
      </g>
      <path d="M46 330l58-49 21 33 36-55 30 47 54-43" fill="none" stroke="#f1cf70" stroke-width="5" opacity="0.72"/>
      <path d="M133 75l-22 68 31-15 17 42 20-58 31 7" fill="none" stroke="#17141d" stroke-width="5" opacity="0.65"/>
    </g>

    <!-- Cicatrizes douradas da recuperação -->
    <path d="M522 70l41 52-26 39 57 38-23 43 48 31M1082 67l-39 55 21 37-52 43 25 40-45 34" fill="none" stroke="url(#gold)" stroke-width="5" opacity="0.88" filter="url(#glow)"/>
    <circle cx="523" cy="70" r="7" fill="#ffe89a"/><circle cx="1082" cy="67" r="7" fill="#ffe89a"/>

    <!-- Tipografia -->
    <g text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif">
      <text x="800" y="188" fill="#b8a8ca" font-size="24" font-weight="700" letter-spacing="8">VERSÃO ANTIGA • RECUPERADA • REFORÇADA</text>
      <text x="800" y="282" fill="#ffffff" font-size="82" font-weight="900" letter-spacing="4" filter="url(#shadow)">NAZUNA BOT</text>
      <text x="800" y="350" fill="#d7b6ff" font-size="42" font-weight="800" letter-spacing="12" filter="url(#glow)">GYOMEI</text>
      <text x="800" y="408" fill="#e3dbea" font-size="22" font-weight="600" letter-spacing="4">MODIFIED EDITION • 1.0.0</text>
    </g>

    <g transform="translate(600 464)" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" font-size="18" letter-spacing="2">
      <rect width="400" height="58" rx="29" fill="#171020" stroke="#9e68d8" stroke-opacity="0.7"/>
      <text x="200" y="36" text-anchor="middle" fill="#f2e9ff">RECOVERED // REBUILT // BUFFED</text>
    </g>

    <rect x="18" y="18" width="1564" height="584" rx="42" fill="none" stroke="url(#gold)" stroke-width="3" opacity="0.62"/>
  </g>
</svg>
