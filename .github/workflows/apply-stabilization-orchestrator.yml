name: Aplicar estabilização pós-teste live

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-stabilization-orchestrator.yml

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Baixar branch de estabilização
        uses: actions/checkout@v4
        with:
          ref: fix/estabilizacao-pos-teste-live
          fetch-depth: 0

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Aplicar correções confirmadas pelo teste live
        run: python dados/src/.scripts/stabilize-live-flow.py

      - name: Instalar dependências limpas
        run: npm ci --omit=dev --no-audit --no-fund

      - name: Validar código e regressões
        run: |
          node --check dados/src/funcs/private/ia.js
          node --check dados/src/index.js
          node --check dados/src/.scripts/prepareRuntimeSources.js
          node --check dados/src/.scripts/applyCriticalRuntimeFixes.js
          node --check dados/src/.scripts/test-assistant-live.js
          node --check dados/src/.scripts/test-regressions.js
          npm run validate:ci

      - name: Gravar branch estabilizada
        run: |
          rm -f dados/src/.runtime-index.js \
                dados/src/.runtime-connect.js \
                dados/src/funcs/private/.runtime-ia.js \
                dados/src/menus/.runtime-index.js \
                dados/src/menus/.runtime-menubn.js \
                dados/src/.scripts/.runtime-start.js
          git config user.name "Alaska_dev"
          git config user.email "mauriciollalmeida26@gmail.com"
          git rm .github/workflows/stabilize-live-flow.yml
          git rm dados/src/.scripts/stabilize-live-flow.py
          git add package.json \
                  dados/src/index.js \
                  dados/src/funcs/private/ia.js \
                  dados/src/.scripts/prepareRuntimeSources.js \
                  dados/src/.scripts/applyCriticalRuntimeFixes.js \
                  dados/src/.scripts/test-regressions.js \
                  dados/src/.scripts/test-assistant-live.js \
                  dados/src/utils/vipCommandsManager.js
          git commit -m "fix: estabilizar NVIDIA e comandos após teste live"
          git push origin HEAD:fix/estabilizacao-pos-teste-live

      - name: Remover orquestrador temporário da main
        run: |
          git reset --hard
          git clean -fd
          git fetch origin main
          git switch main
          git reset --hard origin/main
          git rm .github/workflows/apply-stabilization-orchestrator.yml
          git commit -m "ci: remover orquestrador temporário"
          git push origin main
