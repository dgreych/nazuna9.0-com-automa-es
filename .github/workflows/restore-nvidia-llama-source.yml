name: Restaurar NVIDIA Llama diretamente na fonte

on:
  push:
    branches:
      - fix/ia-nvidia-llama-fonte
    paths:
      - .github/workflows/restore-nvidia-llama-source.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restaurar-llama:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar branch de correção
        uses: actions/checkout@v4
        with:
          ref: fix/ia-nvidia-llama-fonte
          fetch-depth: 0

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Substituir modelo descontinuado diretamente nas fontes
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          old_model = "moonshotai/kimi-k2-instruct"
          new_model = "meta/llama-3.1-70b-instruct"

          targets = [
              Path("dados/src/funcs/private/ia.js"),
              Path("dados/src/index.js"),
          ]

          replacements = {}
          for target in targets:
              source = target.read_text(encoding="utf-8")
              count = source.count(old_model)
              if count == 0 and new_model not in source:
                  raise SystemExit(f"Nenhum modelo conhecido encontrado em {target}")
              updated = source.replace(old_model, new_model)
              target.write_text(updated, encoding="utf-8")
              replacements[str(target)] = count

          test_file = Path("dados/src/.scripts/test-regressions.js")
          tests = test_file.read_text(encoding="utf-8")
          marker = "await test('HTTP 410 da NVIDIA não é repetido três vezes', async () => {"
          regression = r'''
          await test('fontes usam Llama 3.1 70B sem depender de patch no startup', () => {
            const iaSource = fs.readFileSync(new URL('../funcs/private/ia.js', import.meta.url), 'utf8');
            const indexSource = fs.readFileSync(new URL('../index.js', import.meta.url), 'utf8');
            assert.ok(iaSource.includes('meta/llama-3.1-70b-instruct'));
            assert.ok(indexSource.includes('meta/llama-3.1-70b-instruct'));
            assert.ok(!iaSource.includes('moonshotai/kimi-k2-instruct'));
            assert.ok(!indexSource.includes('moonshotai/kimi-k2-instruct'));
          });

          '''
          if "fontes usam Llama 3.1 70B sem depender de patch no startup" not in tests:
              if marker not in tests:
                  raise SystemExit("Ponto de inserção do teste de regressão não encontrado")
              tests = tests.replace(marker, regression + marker, 1)
              test_file.write_text(tests, encoding="utf-8")

          print("Substituições:", replacements)
          PY

      - name: Instalar dependências limpas
        run: npm ci --omit=dev --no-audit --no-fund

      - name: Confirmar que o Kimi saiu das fontes executáveis
        shell: bash
        run: |
          grep -q "meta/llama-3.1-70b-instruct" dados/src/funcs/private/ia.js
          grep -q "meta/llama-3.1-70b-instruct" dados/src/index.js
          ! grep -q "moonshotai/kimi-k2-instruct" dados/src/funcs/private/ia.js
          ! grep -q "moonshotai/kimi-k2-instruct" dados/src/index.js
          grep -q "https://integrate.api.nvidia.com/v1/chat/completions" dados/src/funcs/private/ia.js

      - name: Validar runtime, aliases e integração NVIDIA
        run: npm run validate:ci

      - name: Remover arquivos runtime gerados durante os testes
        shell: bash
        run: |
          rm -f dados/src/.runtime-index.js
          rm -f dados/src/.runtime-connect.js
          rm -f dados/src/funcs/private/.runtime-ia.js
          rm -f dados/src/menus/.runtime-index.js
          rm -f dados/src/menus/.runtime-menubn.js
          rm -f dados/src/.scripts/.runtime-start.js
          rm -f .github/workflows/restore-nvidia-llama-source.yml

      - name: Publicar correção validada na branch
        shell: bash
        run: |
          git config user.name "Alaska_dev"
          git config user.email "mauriciollalmeida26@gmail.com"
          git add dados/src/funcs/private/ia.js dados/src/index.js dados/src/.scripts/test-regressions.js .github/workflows/restore-nvidia-llama-source.yml
          git commit -m "fix: usar Llama 3.1 70B diretamente nas fontes"
          git push origin HEAD:fix/ia-nvidia-llama-fonte
